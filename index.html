<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10天全自动智能闪卡（自适应对齐版）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .phone-container {
            width: 100%; max-width: 414px; height: 100vh; max-height: 736px;
            background: white; box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            border-radius: 20px; display: flex; flex-direction: column; overflow: hidden;
        }
        .calendar-bar {
            background: #2c3e50; padding: 12px 8px; display: flex; gap: 8px;
            overflow-x: auto; scroll-behavior: smooth; border-bottom: 2px solid #1a252f;
        }
        .day-btn {
            background: #34495e; color: #ecf0f1; padding: 6px 14px; border-radius: 15px;
            font-size: 13px; font-weight: bold; white-space: nowrap; cursor: pointer; border: none;
        }
        .day-btn.active { background: #e74c3c; color: white; }
        .day-btn.has-learned { border: 1px solid #2ecc71; }
        .header {
            padding: 14px 16px; background: #3498db; color: white;
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }
        .card-area {
            flex: 1; display: flex; justify-content: center; align-items: center;
            padding: 15px; background: #fdfdfd; position: relative;
        }
        canvas { border-radius: 16px; background: white; max-width: 100%; border: 1px solid #eaeaea; }
        .footer { padding: 20px; display: flex; flex-direction: column; gap: 12px; background: white; border-top: 1px solid #eee; }
        .btn-group { display: flex; gap: 12px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-study { background: #3498db; color: white; }
        .btn-review { background: #2ecc71; color: white; }
        .btn-action { background: #e74c3c; color: white; }
        .btn-yes { background: #2ecc71; color: white; }
        .btn-no { background: #95a5a6; color: white; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="calendar-bar" id="calendarBar"></div>
    <div class="header">
        <span id="mode-title">正在加载...</span>
        <span id="progress-text">学完: 0/0</span>
    </div>
    <div class="card-area">
        <canvas id="cardCanvas" width="360" height="420"></canvas>
    </div>
    <div class="footer">
        <div class="btn-group">
            <button class="btn-study" id="nav-study" onclick="switchMode('study')">今日背诵 📝</button>
            <button class="btn-review" id="nav-review" onclick="switchMode('review')">全局复习 ⏳</button>
        </div>
        <div id="action-area" class="btn-group"></div>
    </div>
</div>

<script>
// 测试加速参数：第一阶段设为 0.05 分钟（3秒钟到期）
const ebbinghausIntervals = [0, 0.05, 30, 720, 1440, 2880, 5760, 10080, 21600];

let currentDayNum = 1;
let currentMode = 'study'; 
let currentList = [];      
let activeDayWords = []; 
let currentIndex = 0;      
let reviewStep = 0;        

let userProgress = JSON.parse(localStorage.getItem('vocab_progress_v5')) || {};

window.onload = function() {
    renderCalendar();
    loadDayFile(currentDayNum);
};

function renderCalendar() {
    const bar = document.getElementById('calendarBar');
    bar.innerHTML = '';
    for (let d = 1; d <= 10; d++) {
        const btn = document.createElement('button');
        btn.className = `day-btn ${d === currentDayNum ? 'active' : ''}`;
        btn.innerText = `第 ${d} 天`;
        btn.onclick = () => { currentDayNum = d; renderCalendar(); loadDayFile(d); };
        bar.appendChild(btn);
    }
}

function loadDayFile(dayNum) {
    const fileName = `day${dayNum}.json`;
    fetch(fileName)
        .then(res => {
            if (!res.ok) throw new Error(`请检查是否存在 ${fileName}`);
            return res.json();
        })
        .then(data => {
            activeDayWords = data;
            activeDayWords.forEach(w => {
                if (!userProgress[w.id]) userProgress[w.id] = { stage: 0, nextReviewTime: 0 };
            });
            saveProgress();
            switchMode(currentMode);
        })
        .catch(err => {
            activeDayWords = []; currentList = []; updateUI();
            const canvas = document.getElementById('cardCanvas'); const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "red"; ctx.font = "14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(`❌ 读取错误: 找不到文件 ${fileName}`, canvas.width / 2, canvas.height / 2);
        });
}

function switchMode(mode) {
    currentMode = mode; currentIndex = 0; reviewStep = 0;
    refreshList();
}

function refreshList() {
    if (currentMode === 'study') {
        currentList = activeDayWords.filter(w => userProgress[w.id].stage === 0);
        document.getElementById('mode-title').innerText = `第 ${currentDayNum} 天 📝 背诵`;
    } else {
        const now = Date.now();
        currentList = activeDayWords.filter(w => {
            const prog = userProgress[w.id];
            return prog && prog.stage > 0 && now >= prog.nextReviewTime;
        });
        document.getElementById('mode-title').innerText = `全局艾宾浩斯复习 ⏳`;
    }
    updateUI();
}

function updateUI() {
    const learnedInDay = activeDayWords.filter(w => userProgress[w.id] && userProgress[w.id].stage > 0).length;
    document.getElementById('progress-text').innerText = `今日已学: ${learnedInDay}/${activeDayWords.length}`;
    
    const actionArea = document.getElementById('action-area');
    if (activeDayWords.length === 0) return;

    if (currentList.length === 0) {
        if (currentMode === 'study' && currentDayNum < 10) {
            actionArea.innerHTML = `<button class="btn-action" onclick="goToNextDay()">今日学完，开启第 ${currentDayNum + 1} 天</button>`;
        } else {
            actionArea.innerHTML = `<button class="btn-action" style="background:#ccc;" disabled>当前队列已清空</button>`;
        }
    } else if (currentMode === 'study') {
        actionArea.innerHTML = `<button class="btn-study" onclick="handleAction()">已学会，下一张</button>`;
    } else {
        if (reviewStep === 0) actionArea.innerHTML = `<button class="btn-study" onclick="handleAction()">看大图提示 🖼️</button>`;
        else if (reviewStep === 1) actionArea.innerHTML = `<button class="btn-study" onclick="handleAction()">看例句翻译 📝</button>`;
        else if (reviewStep === 2) {
            actionArea.innerHTML = `
                <button class="btn-no" onclick="feedbackReview(false)">❌ 没记住</button>
                <button class="btn-yes" onclick="feedbackReview(true)">✅ 记住了</button>
            `;
        }
    }
    drawCard();
}

function handleAction() {
    if (currentList.length === 0) return;
    if (currentMode === 'study') {
        const currentWord = currentList[currentIndex];
        userProgress[currentWord.id].stage = 1;
        userProgress[currentWord.id].nextReviewTime = Date.now() + ebbinghausIntervals[1] * 60 * 1000;
        saveProgress(); refreshList();
    } else {
        if (reviewStep < 2) { reviewStep++; updateUI(); }
    }
}

function feedbackReview(remembered) {
    const currentWord = currentList[currentIndex];
    const prog = userProgress[currentWord.id];
    let nextStage = remembered ? Math.min(8, prog.stage + 1) : 1;
    userProgress[currentWord.id].stage = nextStage;
    userProgress[currentWord.id].nextReviewTime = Date.now() + ebbinghausIntervals[nextStage] * 60 * 1000;
    saveProgress(); reviewStep = 0; refreshList();
}

function goToNextDay() { currentDayNum++; renderCalendar(); loadDayFile(currentDayNum); }
function saveProgress() { localStorage.setItem('vocab_progress_v5', JSON.stringify(userProgress)); }

// 🎨 核心修复：自适应高度的渲染引擎
function drawCard() {
    const canvas = document.getElementById('cardCanvas'); const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (currentList.length === 0) {
        ctx.fillStyle = "#7f8c8d"; ctx.font = "16px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(currentMode === 'study' ? "🎉 今日任务达成！" : "☕ 暂时没有到期的复习词汇", canvas.width / 2, canvas.height / 2);
        return;
    }
    const wordObj = currentList[currentIndex];
    
    // 1. 单词
    ctx.fillStyle = "#2c3e50"; ctx.font = "bold 34px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(wordObj.word, canvas.width / 2, 65);
    
    // 2. 音标与提示框
    let boxBottomY = 240; // 记录上方提示区域的底部位置
    if (currentMode === 'study' || reviewStep >= 1) {
        ctx.fillStyle = "#e74c3c"; ctx.font = "20px sans-serif"; ctx.fillText(wordObj.phonetic, canvas.width / 2, 105);
        ctx.fillStyle = "#f8f9fa"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(20, 125, canvas.width - 40, 115, 12) : ctx.rect(20, 125, canvas.width - 40, 115); ctx.fill();
        ctx.fillStyle = "#34495e"; ctx.font = "15px sans-serif"; wrapText(ctx, wordObj.scene, canvas.width / 2, 155, canvas.width - 70, 24);
    } else {
        ctx.fillStyle = "#ecf0f1"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(20, 125, canvas.width - 40, 115, 12) : ctx.rect(20, 125, canvas.width - 40, 115); ctx.fill();
        ctx.fillStyle = "#bdc3c7"; ctx.font = "bold 16px sans-serif"; ctx.fillText("🧠 努力检索这个单词的场景大图...", canvas.width / 2, 185);
    }
    
    // 3. 动态计算例句与翻译（防止重叠遮挡）
    if (currentMode === 'study' || reviewStep === 2) {
        let currentY = boxBottomY + 25; // 例句起始 Y 坐标
        
        // 渲染英文例句
        ctx.fillStyle = "#2c3e50"; ctx.font = "600 15px sans-serif";
        let nextY = wrapText(ctx, `📝 ${wordObj.sentence}`, canvas.width / 2, currentY, canvas.width - 40, 22);
        
        // 根据英文例句实际结束的 nextY，动态计算中文翻译的起始坐标
        currentY = nextY + 12; 
        ctx.fillStyle = "#27ae60"; ctx.font = "14px sans-serif";
        wrapText(ctx, `🇨🇳 ${wordObj.translation}`, canvas.width / 2, currentY, canvas.width - 40, 22);
    }
}

// 🎯 升级版 wrapText：返回最后一行绘制完毕后的下边缘 Y 坐标
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(''); let line = ''; let currentY = y;
    for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n];
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
            ctx.fillText(line, x, currentY); line = words[n]; currentY += lineHeight;
        } else { line = testLine; }
    }
    ctx.fillText(line, x, currentY);
    return currentY; // 返回当前文本块写到了哪高度
}
</script>
</body>
</html>
